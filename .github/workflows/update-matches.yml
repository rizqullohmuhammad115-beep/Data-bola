name: Update Matches

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get today's date
        id: date
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Get football matches
        env:
          MATCH_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -e

          URL="https://www.sofascore.com/api/v1/sport/football/scheduled-events/$MATCH_DATE"

          curl -L --fail --silent --show-error \
            -A "Mozilla/5.0" \
            "$URL" \
            -o sofascore.json

          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          date = os.environ["MATCH_DATE"]

          with open("sofascore.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          matches = []

          for event in data.get("events", []):
              home = event.get("homeTeam", {})
              away = event.get("awayTeam", {})
              tournament = event.get("tournament", {})
              category = tournament.get("category", {})

              if not home.get("name") or not away.get("name"):
                  continue

              matches.append({
                  "id": event.get("id"),
                  "home": home.get("name"),
                  "away": away.get("name"),
                  "home_id": home.get("id"),
                  "away_id": away.get("id"),
                  "league": tournament.get("name"),
                  "country": category.get("name"),
                  "start_timestamp": event.get("startTimestamp"),
                  "status": event.get("status", {}).get("type")
              })

          output = {
              "date": date,
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "total": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Total matches: {len(matches)}")
          PY

      - name: Commit matches.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update matches"
            git push
          fi
