name: Update Matches

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get today's matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          curl -fsSL \
            -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
            "https://api.football-data.org/v4/matches?dateFrom=$DATE&dateTo=$DATE" \
            -o matches-api.json

          node <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(fs.readFileSync('matches-api.json', 'utf8'));

          const matches = (data.matches || []).map(m => ({
            id: m.id,
            league: m.competition?.name || null,
            league_code: m.competition?.code || null,
            home: m.homeTeam?.name || null,
            away: m.awayTeam?.name || null,
            date: m.utcDate || null,
            status: m.status || null,
            home_score: m.score?.fullTime?.home ?? null,
            away_score: m.score?.fullTime?.away ?? null
          }));

          const result = {
            date: new Date().toISOString().slice(0, 10),
            updated_at: new Date().toISOString(),
            total: matches.length,
            matches
          };

          fs.writeFileSync(
            'matches.json',
            JSON.stringify(result, null, 2) + '\n'
          );

          console.log(`Saved ${matches.length} matches`);
          NODE

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update matches"
            git push
          fi
